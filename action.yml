name: 'Squash and sign'
description: |
  Force-replaces a pull-request branch with one Verified commit (or a chunked
  series, if the diff exceeds GitHub's 45MB GraphQL limit) derived from the PR's
  diff vs base. The workflow file that triggered this action is removed from the
  squash so the base branch never sees it. Same-repo PRs only.

inputs:
  github-token:
    description: 'Token to push with. Default produces commits attributed to github-actions[bot] and marked Verified.'
    default: ${{ github.token }}
  workflow-path:
    description: 'Path of the self-destructing workflow file to drop from the squash. Defaults to the path inferred from github.workflow_ref.'
    default: ''
  commit-title:
    description: 'Title for the squashed commit. Defaults to the PR title.'
    default: ${{ github.event.pull_request.title }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0

    - name: Resolve self-destruct path
      id: resolve
      shell: bash
      env:
        WORKFLOW_PATH_INPUT: ${{ inputs.workflow-path }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [ -n "$WORKFLOW_PATH_INPUT" ]; then
          path="$WORKFLOW_PATH_INPUT"
        else
          # github.workflow_ref: owner/repo/<path>@<ref>
          rest="${WORKFLOW_REF#*/}"
          rest="${rest#*/}"
          path="${rest%@*}"
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Pre-flight - skip if only the workflow file differs from base
      id: precheck
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        WORKFLOW_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$BASE"
        if git diff --quiet "origin/$BASE..HEAD" -- ":!$WORKFLOW_PATH"; then
          echo "Only $WORKFLOW_PATH differs from origin/$BASE; nothing to squash."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Wipe remote PR branch back to base
      if: steps.precheck.outputs.skip != 'true'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD: ${{ github.event.pull_request.head.ref }}
      # push-signed-commits requires merge-base(local, remote) == remote-head, so wipe first.
      run: git push origin "+refs/remotes/origin/$BASE:refs/heads/$HEAD"

    - name: Squash PR into one local commit (drop the workflow file)
      if: steps.precheck.outputs.skip != 'true'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        TITLE: ${{ inputs.commit-title }}
        WORKFLOW_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail

        git config user.name  'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        # `|| true` swallows grep's no-match exit when every commit was by the bot.
        coauthors=$(git log "origin/$BASE..HEAD" --format='Co-authored-by: %an <%ae>' \
          | { grep -vF 'github-actions[bot]' || true; } \
          | sort -u)

        git reset --soft "origin/$BASE"
        git rm --cached -f "$WORKFLOW_PATH"

        # Two -m args render as separate paragraphs (blank line between).
        if [ -n "$coauthors" ]; then
          git commit -m "$TITLE" -m "$coauthors"
        else
          git commit -m "$TITLE"
        fi

    - name: Push the squashed commit as Verified
      if: steps.precheck.outputs.skip != 'true'
      uses: cfal/push-signed-commits@main
      with:
        github-token: ${{ inputs.github-token }}
        local_branch_name: ${{ github.event.pull_request.head.ref }}
        remote_branch_name: ${{ github.event.pull_request.head.ref }}
        include_source_hash: 'false'

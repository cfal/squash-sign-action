name: 'Squash and sign'
description: |
  Force-replaces a pull-request branch with Verified commits derived from the
  PR's diff vs base. By default squashes everything into one commit; with
  squash: 'false' produces one Verified commit per original PR commit. Same-repo
  PRs only.

inputs:
  github-token:
    description: 'Token to push with. Default produces commits attributed to github-actions[bot] and marked Verified.'
    default: ${{ github.token }}
  workflow-path:
    description: 'Path of the self-destructing workflow file to drop from the squash. Defaults to the path inferred from github.workflow_ref.'
    default: ''
  commit-title:
    description: "Title for the squashed commit. Defaults to the PR title. Ignored when squash is 'false'."
    default: ${{ github.event.pull_request.title }}
  reset-workflows:
    description: 'If true, restore .github/workflows from base before commit. Use this when the trigger commit deleted other workflow files to keep them quiet. WARNING: any genuine workflow-file edits in the PR are clobbered.'
    default: 'false'
  squash:
    description: "If 'true' (default), squash all PR commits into a single Verified commit. If 'false', create one Verified commit per original PR commit, preserving authorship and message per commit."
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0

    - name: Resolve self-destruct path
      id: resolve
      shell: bash
      env:
        WORKFLOW_PATH_INPUT: ${{ inputs.workflow-path }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [ -n "$WORKFLOW_PATH_INPUT" ]; then
          path="$WORKFLOW_PATH_INPUT"
        else
          # github.workflow_ref: owner/repo/<path>@<ref>
          rest="${WORKFLOW_REF#*/}"
          rest="${rest#*/}"
          path="${rest%@*}"
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Pre-flight - skip if no real changes vs base
      id: precheck
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        WORKFLOW_PATH: ${{ steps.resolve.outputs.path }}
        RESET_WORKFLOWS: ${{ inputs.reset-workflows }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$BASE"
        # Exclude paths that won't survive into the squash: just sign.yml normally,
        # the whole .github/workflows tree when reset-workflows is on.
        if [ "$RESET_WORKFLOWS" = "true" ]; then
          exclude=':!.github/workflows'
        else
          exclude=":!$WORKFLOW_PATH"
        fi
        if git diff --quiet "origin/$BASE..HEAD" -- "$exclude"; then
          echo "Nothing to squash beyond $exclude."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Squash PR into one local commit (drop the workflow file)
      if: steps.precheck.outputs.skip != 'true' && inputs.squash == 'true'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        TITLE: ${{ inputs.commit-title }}
        WORKFLOW_PATH: ${{ steps.resolve.outputs.path }}
        RESET_WORKFLOWS: ${{ inputs.reset-workflows }}
      run: |
        set -euo pipefail

        git config user.name  'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        # Collect each commit's author plus any existing Co-authored-by trailers,
        # in chronological order, deduped without re-sorting.
        # `|| true` swallows grep's no-match exit when every commit was by the bot.
        coauthors=$(git log --reverse "origin/$BASE..HEAD" \
            --format='Co-authored-by: %an <%ae>%n%(trailers:key=Co-authored-by)' \
          | grep -E '^Co-authored-by: ' \
          | { grep -vF 'github-actions[bot]' || true; } \
          | awk '!seen[$0]++')

        git reset --soft "origin/$BASE"

        # Restore .github/workflows from base, replacing any deletions/edits the
        # trigger commit made there. Skipped if base has no workflows directory.
        if [ "$RESET_WORKFLOWS" = "true" ] \
            && git cat-file -e "origin/$BASE":.github/workflows 2>/dev/null; then
          git checkout "origin/$BASE" -- .github/workflows
        fi

        git rm --cached -f "$WORKFLOW_PATH"

        # Two -m args render as separate paragraphs (blank line between).
        if [ -n "$coauthors" ]; then
          git commit -m "$TITLE" -m "$coauthors"
        else
          git commit -m "$TITLE"
        fi

    - name: Push the squashed commit as Verified
      if: steps.precheck.outputs.skip != 'true'
      uses: cfal/push-signed-commits@main
      with:
        github-token: ${{ inputs.github-token }}
        local_branch_name: ${{ github.event.pull_request.head.ref }}
        remote_branch_name: ${{ github.event.pull_request.head.ref }}
        include_source_hash: 'false'
        force_reset_ref: 'true'
        # In squash mode the local commit already has the right tree, so no
        # paths need filtering server-side. In non-squash mode push-signed-commits
        # walks the original PR commits and we filter sign.yml (always) plus
        # .github/workflows when reset-workflows is on.
        exclude_paths: ${{ inputs.squash == 'false' && (inputs.reset-workflows == 'true' && '.github/workflows' || steps.resolve.outputs.path) || '' }}
        # In non-squash mode local and remote point at the same commit, so
        # merge-base would resolve to that commit and find no commits to push.
        # Tell push-signed-commits to use the base branch as the fork point.
        parent_ref: ${{ inputs.squash == 'false' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
